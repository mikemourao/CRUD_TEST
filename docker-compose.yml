services:
  mysql:
    image: mysql:8.4
    container_name: wenlock-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wenlock
      MYSQL_USER: wenlock
      MYSQL_PASSWORD: wenlock
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - wenlock_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  wenlock_mysql_data:
